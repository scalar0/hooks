#:schema https://raw.githubusercontent.com/evilmartians/lefthook/refs/heads/master/schema.json

[templates]
c = '''
set -eu pipefail
crates=$(git diff --name-only --cached | rg -oP '(?<=crates/)[^/]+(?=/src/)' | sort -u)
if [ -z "$crates" ]; then
  echo "No staged Rust crate files under crates/, skipping."
  exit 0
fi
'''
f = "--all-targets --all-features --color=never"

[pre-commit.commands.cargo-clippy]
glob        = "*.rs"
priority    = 1
run         = 'cargo clippy {f} --workspace --fix --keep-going --allow-dirty -- -D warnings'
stage_fixed = true
tags        = ["fix"]

[pre-commit.commands.cargo-fmt]
glob        = "*.rs"
priority    = 0
run         = 'cargo fmt --all --verbose'
stage_fixed = true
tags        = ["fmt"]

[pre-commit.scripts."cargo-deptree.sh"]
priority = 2
runner   = "bash"
tags     = ["docs"]

[post-commit.commands.cargo-nextest]
glob = "*.rs"
run = '''
{c}
for crate in $crates; do
  echo "Running nextest for crate: $crate"
  cargo nextest run --profile=ci -p "$crate" {f}
done
'''
tags = ["test"]

[pre-push.commands.cargo-clean]
glob     = "*.rs"
priority = 1
run      = 'cargo clean'
tags     = ["build"]

[pre-push.commands.cargo-build]
glob     = "*.rs"
priority = 2
run      = 'cargo b {f} --workspace'
tags     = ["build"]

[pre-merge-commit.commands.require-tests-on-main-merge]
fail_text = "Workspace tests must pass before merging a local branch into main/master."
run       = "cargo nextest run --profile=agent --workspace --all-targets --all-features"
tags      = ["test"]
